[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "laserbox-mcp"
version = "0.1.0"
description = "MCP server for LaserBox CNC management system"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Franco Meneses", email = "bestackdevelopment@gmail.com"}
]
keywords = ["mcp", "laserbox", "cnc", "manufacturing"]
dependencies = [
    "fastmcp>=2.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
